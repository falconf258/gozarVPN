name: Release Aether GUI

# Push a tag like v1.0.1 (must match "version" in package.json) to build and
# publish a new Windows release. electron-updater on users' machines then
# discovers it automatically the next time the app checks for updates —
# no manual asset wrangling needed.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build & publish (NSIS + portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

      - name: Upload build artifacts (backup copy on the workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: aether-gui-windows
          path: |
            release/*.exe
            release/latest.yml
